[package]
name = "xiaowu_image_converter_pro"
version = "0.1.0"
description = "小午的图片转换 Pro"
authors = ["猫汰"]
edition = "2021"

[lib]
name = "xiaowu_image_converter_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
